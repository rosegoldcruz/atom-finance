<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATOM | Financial Operating System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              atom: {
                bg: '#050505',
                card: '#0A0A0A',
                border: '#1F1F1F',
                accent: '#00F0FF', // Cyan
                success: '#00FF94', // Green
                warning: '#FFD600', // Yellow
                error: '#FF2E2E', // Red
                text: '#E4E4E7',
                muted: '#52525B',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan-line': 'scan 2s linear infinite',
              'blink': 'blink 1s step-end infinite',
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #E4E4E7;
      }
      /* Tech borders */
      .tech-border {
        position: relative;
        border: 1px solid #1F1F1F;
      }
      .tech-border::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 8px;
        height: 8px;
        border-top: 1px solid #52525B;
        border-left: 1px solid #52525B;
        transition: all 0.3s ease;
      }
      .tech-border::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 8px;
        height: 8px;
        border-bottom: 1px solid #52525B;
        border-right: 1px solid #52525B;
        transition: all 0.3s ease;
      }
      .tech-border:hover::before, .tech-border:hover::after {
        border-color: #00F0FF;
        width: 100%;
        height: 100%;
        opacity: 0.1;
      }
      
      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0A0A;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      /* CRT Effect Overlay (optional, subtle) */
      .crt-line {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
        background-size: 100% 4px;
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        opacity: 0.03;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div class="crt-line"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
